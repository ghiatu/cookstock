name: CookStock Daily Scan (SET100)

permissions:
  contents: write

on:
  schedule:
    # ตลาดไทยปิด 16:30 ICT = 09:30 UTC -> ตั้งรันตอน 17:00 ICT = 10:00 UTC
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib requests beautifulsoup4 lxml html5lib yfinance yahoofinancials

      - name: Run CookStock pipeline (SET100)
        run: python batch/cookStockPipeline.py

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_notify.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Daily SET100 scan results $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push